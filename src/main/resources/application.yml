spring:
  application:
    name: thesis-social-features
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SOCIAL_DB_URL:jdbc:postgresql://localhost:5432/${SOCIAL_DB_NAME:social_features}}
    username: ${SOCIAL_DB_USER:social}
    password: ${SOCIAL_DB_PASSWORD:social}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SOCIAL_RABBIT_HOST:localhost}
    port: 5672
    username: ${SOCIAL_RABBIT_USER:guest}
    password: ${SOCIAL_RABBIT_PASSWORD:guest}

server:
  port: ${SOCIAL_APP_PORT:8086}

social:
  cors:
    allowed-origins: ${SOCIAL_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      # Preferred: resolve verification keys from Auth's published key set, selected by kid.
      # Falls back to the static public key when this is unset.
      jwks-uri: ${SOCIAL_JWT_JWKS_URI:}
      public-key: ${SOCIAL_JWT_PUBLIC_KEY:}
      # Pinning a kid is incompatible with JWKS rotation and is ignored when jwks-uri is set.
      signing-kid: ${SOCIAL_JWT_SIGNING_KID:}
      issuer: ${SOCIAL_JWT_ISSUER:therapist-auth}
      audience: ${SOCIAL_JWT_AUDIENCE:social-features}
  websocket:
    endpoint: ${SOCIAL_WS_ENDPOINT:/ws}
    app-destination-prefix: /app
    user-destination-prefix: /user
  broker:
    relay-host: ${SOCIAL_STOMP_RELAY_HOST:localhost}
    relay-port: 61613
    relay-virtual-host: ${SOCIAL_STOMP_RELAY_VHOST:/}
    relay-client-login: ${SOCIAL_STOMP_RELAY_LOGIN:guest}
    relay-client-passcode: ${SOCIAL_STOMP_RELAY_PASSCODE:guest}
    relay-system-login: ${SOCIAL_STOMP_SYSTEM_LOGIN:guest}
    relay-system-passcode: ${SOCIAL_STOMP_SYSTEM_PASSCODE:guest}
  event:
    exchange: ${SOCIAL_EVENTS_EXCHANGE:social.domain.events}
    routing-prefix: ${SOCIAL_EVENTS_ROUTING_PREFIX:social}

# Shared domain-event broker (the auth stack's RabbitMQ) that therapist-api publishes
# assignment events on. Distinct from spring.rabbitmq above, which is the social service's
# own broker (STOMP relay + social domain events). Host port 5671 -> auth rabbitmq 5672.
therapist:
  api:
    exchange: ${THERAPIST_API_EXCHANGE:booking.exchange}
  rabbitmq:
    host: ${THERAPIST_RABBIT_HOST:localhost}
    port: ${THERAPIST_RABBIT_PORT:5671}
    username: ${THERAPIST_RABBIT_USER:guest}
    password: ${THERAPIST_RABBIT_PASSWORD:guest}
