# Memory ceilings target an 8 GiB host shared with the other three stacks. JAVA_TOOL_OPTIONS
# uses MaxRAMPercentage rather than a literal -Xmx so the heap is derived from mem_limit (the
# JVM reads the cgroup) and the two cannot drift apart.
services:
  postgres:
    image: postgres:16-alpine
    container_name: social-postgres
    mem_limit: 256m
    restart: unless-stopped
    command: postgres -c shared_buffers=32MB -c max_connections=50
    environment:
      POSTGRES_DB: ${SOCIAL_DB_NAME:-social_features}
      POSTGRES_USER: ${SOCIAL_DB_USER:-social}
      POSTGRES_PASSWORD: ${SOCIAL_DB_PASSWORD:-social}
    ports:
      - "5436:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOCIAL_DB_USER:-social} -d ${SOCIAL_DB_NAME:-social_features}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: social-rabbitmq
    # Higher ceiling than the auth broker: this one also loads the STOMP / web-STOMP
    # plugins that carry chat.
    mem_limit: 512m
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${SOCIAL_RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${SOCIAL_RABBIT_PASSWORD:-guest}
    command: >
      /bin/sh -c
      "rabbitmq-plugins enable --offline rabbitmq_management rabbitmq_stomp rabbitmq_web_stomp;
      rabbitmq-server"
    ports:
      - "5676:5672"
      - "15676:15672"
      - "61613:61613"
      - "15675:15674"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 8
    networks:
      - backend

  api:
    build:
      context: .
    container_name: social-api
    mem_limit: 640m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Xss512k"
      SOCIAL_DB_URL: jdbc:postgresql://${SOCIAL_DB_HOST:-postgres}:5432/${SOCIAL_DB_NAME:-social_features}
      SOCIAL_RABBIT_HOST: ${SOCIAL_RABBIT_HOST:-rabbitmq}
      SOCIAL_STOMP_RELAY_HOST: ${SOCIAL_STOMP_RELAY_HOST:-rabbitmq}
      # Verification keys come from Auth's published key set, selected by kid, so a rotation
      # at Auth needs no redeploy here. auth-service resolves over the umatter-shared network.
      SOCIAL_JWT_JWKS_URI: ${SOCIAL_JWT_JWKS_URI:-http://auth-service:8081/internal/v1/.well-known/jwks.json}
      # Shared domain-event broker (auth stack's RabbitMQ) carrying therapist-api's
      # assignment events; reached over the host gateway on its published port.
      THERAPIST_RABBIT_HOST: ${THERAPIST_RABBIT_HOST:-host.docker.internal}
      THERAPIST_RABBIT_PORT: ${THERAPIST_RABBIT_PORT:-5671}
      THERAPIST_RABBIT_USER: ${THERAPIST_RABBIT_USER:-guest}
      THERAPIST_RABBIT_PASSWORD: ${THERAPIST_RABBIT_PASSWORD:-guest}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - umatter-shared
    # Resolve host.docker.internal to the host gateway so the container can
    # reach the auth stack's RabbitMQ on its host-published port (5671).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  social_postgres_data:

networks:
  backend:
    driver: bridge
  umatter-shared:
      external: true
