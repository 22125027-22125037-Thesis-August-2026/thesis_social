services:
  postgres:
    image: postgres:16-alpine
    container_name: social-postgres
    environment:
      POSTGRES_DB: ${SOCIAL_DB_NAME:-social_features}
      POSTGRES_USER: ${SOCIAL_DB_USER:-social}
      POSTGRES_PASSWORD: ${SOCIAL_DB_PASSWORD:-social}
    ports:
      - "${SOCIAL_DB_EXTERNAL_PORT:-5436}:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOCIAL_DB_USER:-social} -d ${SOCIAL_DB_NAME:-social_features}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4:8.13
    container_name: social-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${SOCIAL_PGADMIN_EMAIL:-admin@social.local}
      PGADMIN_DEFAULT_PASSWORD: ${SOCIAL_PGADMIN_PASSWORD:-admin}
    ports:
      - "${SOCIAL_PGADMIN_PORT:-5056}:80"
    volumes:
      - social_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: social-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${SOCIAL_RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${SOCIAL_RABBIT_PASSWORD:-guest}
    command: >
      /bin/sh -c
      "rabbitmq-plugins enable --offline rabbitmq_management rabbitmq_stomp rabbitmq_web_stomp;
      rabbitmq-server"
    ports:
      - "${SOCIAL_RABBIT_EXTERNAL_PORT:-5676}:5672"
      - "${SOCIAL_RABBIT_MGMT_PORT:-15676}:15672"
      - "${SOCIAL_STOMP_RELAY_PORT:-61613}:61613"
      - "${SOCIAL_RABBIT_WEB_STOMP_PORT:-15675}:15674"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 8
    networks:
      - backend

  api:
    build:
      context: .
    container_name: social-api
    env_file:
      - .env
    environment:
      SOCIAL_DB_URL: jdbc:postgresql://${SOCIAL_DB_HOST:-postgres}:${SOCIAL_DB_PORT:-5432}/${SOCIAL_DB_NAME:-social_features}
      SOCIAL_RABBIT_HOST: ${SOCIAL_RABBIT_HOST:-rabbitmq}
      SOCIAL_STOMP_RELAY_HOST: ${SOCIAL_STOMP_RELAY_HOST:-rabbitmq}
    ports:
      - "${SOCIAL_APP_PORT:-8086}:${SOCIAL_APP_PORT:-8086}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - umatter-shared

volumes:
  social_postgres_data:
  social_pgadmin_data:

networks:
  backend:
    driver: bridge
  umatter-shared:
      external: true